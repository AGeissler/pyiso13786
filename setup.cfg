[metadata]
name = ISO_13786
version = 1.4.0
author = Achim Geissler
author_email = achim.geissler@fhnw.ch
description = Python code for dynamic thermal characteristics of building components and spaces
url = git@gitlab.fhnw.ch:GruppeBau/iso_13786.git
long_description = file:README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Environment :: Console
    Intended Audience :: Developers
keywords =
    ISO 13786
    building energy
    dynamic thermal characteristics

[options]
packages = find_namespace:
package_dir =
    = src
include_package_data = True
python_requires = >=3.10
zip_safe = False
install_requires =
    dataclasses
    matplotlib
    pandas
    numpy
    pathlib

[options.packages.find]
where = src

[options.package_data]
where = data
